name: Build APK

# Every push to main builds a debug APK for the TV (armeabi-v7a) and keeps it as a run artifact.
# A v*.*.* tag also builds a release APK and attaches it to a GitHub release. The release is
# signed with the key in the SIGNING_* secrets when they exist, otherwise it is debug-signed.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ABI: armeabi-v7a
  NDK_VERSION: 27.1.12297006

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" > /dev/null

      - name: Build debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: ./gradlew assembleDebug -Pabis=$ABI --stacktrace

      - name: Upload debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: tv-airplay-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Configure release signing
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "storeFile=$RUNNER_TEMP/release.jks"
              echo "storePassword=$SIGNING_STORE_PASSWORD"
              echo "keyAlias=$SIGNING_KEY_ALIAS"
              echo "keyPassword=$SIGNING_KEY_PASSWORD"
            } >> local.properties
            echo "SIGNED=release" >> "$GITHUB_ENV"
          else
            echo "::warning::No SIGNING_* secrets; publishing a debug-signed build"
            echo "SIGNED=debug" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)
          if [ "$SIGNED" = release ]; then
            ./gradlew assembleRelease -Pabis=$ABI --stacktrace
            cp app/build/outputs/apk/release/app-release.apk "tv-airplay-${GITHUB_REF_NAME}-$ABI.apk"
          else
            ./gradlew assembleDebug -Pabis=$ABI --stacktrace
            cp app/build/outputs/apk/debug/app-debug.apk "tv-airplay-${GITHUB_REF_NAME}-$ABI-debug.apk"
          fi
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Publish release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          files: tv-airplay-*.apk
